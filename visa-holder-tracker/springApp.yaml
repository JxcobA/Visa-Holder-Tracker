# =============================================================================
# Spring Boot Visa Holder Tracker deployment.
#
# This file creates:
#   1. Deployment -> Spring Boot application pods
#   2. Service    -> internal application access
#
# Dependencies:
#   - db-config ConfigMap
#   - db-secret Secret
#   - postgres deployment/service
#
# Apply after postgres.yaml:
#   kubectl apply -f springApp.yaml
# =============================================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: visa-holder-tracker
  labels:
    app: visa-holder-tracker

spec:

  # Number of application pod replicas.
  #
  # Multiple replicas improve:
  #   - availability
  #   - fault tolerance
  #   - load distribution
  replicas: 2

  selector:
    matchLabels:
      app: visa-holder-tracker

  template:
    metadata:
      labels:
        app: visa-holder-tracker

    spec:
      containers:

        - name: visa-holder-tracker

          # Docker image containing
          # the Spring Boot application.
          #
          # Replace with your pushed registry image if needed.
          image: visa-holder-tracker:latest

          # Only pull the image
          # if it does not already exist locally.
          imagePullPolicy: IfNotPresent

          ports:
            - name: http

              # Spring Boot application port.
              #
              # Must match:
              #   server.port
              # and Dockerfile EXPOSE value.
              containerPort: 9000

          envFrom:

            # Loads shared non-sensitive configuration:
            #   - datasource URL
            #   - Hibernate settings
            #   - AWS configuration
            - configMapRef:
                name: db-config

            # Loads sensitive credentials:
            #   - database password
            #   - JWT signing secret
            - secretRef:
                name: db-secret

          env:

            # Maps POSTGRES_USER from the Secret
            # to the Spring Boot datasource username property.
            #
            # Keeps database credentials centralized
            # in one secret source.
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER

            # Maps POSTGRES_PASSWORD from the Secret
            # to the Spring Boot datasource password property.
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD

          resources:

            # Minimum guaranteed resources
            # reserved for each application pod.
            requests:
              cpu: "250m"
              memory: "512Mi"

            # Maximum resources
            # a pod is allowed to consume.
            limits:
              cpu: "1"
              memory: "1Gi"

          # Readiness probe:
          # checks whether the application
          # is ready to receive traffic.
          #
          # Kubernetes will not route requests
          # to the pod until this succeeds.
          #
          # Uses the Spring Boot Actuator
          # health endpoint.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9000

            # Wait before first readiness check.
            initialDelaySeconds: 30

            # Probe frequency.
            periodSeconds: 10

            # Probe timeout limit.
            timeoutSeconds: 3

            # Number of failed checks
            # before marking pod unready.
            failureThreshold: 6

          # Liveness probe:
          # checks whether the application
          # is still healthy and responsive.
          #
          # Failed checks trigger
          # automatic container restart.
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9000

            # Delay before liveness checks begin.
            initialDelaySeconds: 60

            # Probe frequency.
            periodSeconds: 15

            # Probe timeout limit.
            timeoutSeconds: 3

            # Failed check threshold
            # before restart occurs.
            failureThreshold: 3

---
apiVersion: v1
kind: Service

metadata:
  name: visa-holder-tracker
  labels:
    app: visa-holder-tracker

spec:

  # Internal Kubernetes service.
  #
  # Accessible inside the cluster only.
  type: ClusterIP

  selector:
    app: visa-holder-tracker

  ports:

    - name: http

      # Service port exposed internally.
      port: 80

      # Target Spring Boot container port.
      targetPort: 9000