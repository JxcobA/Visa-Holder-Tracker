# =============================================================================
# 3) springApp.yaml  — APPLY LAST
# Visa Holder Tracker (Spring Boot): Deployment + Service.
# Container listens on 9000 (matches EXPOSE 9000 in your Dockerfile).
#   kubectl apply -f springApp.yaml
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: visa-holder-tracker
  labels:
    app: visa-holder-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visa-holder-tracker
  template:
    metadata:
      labels:
        app: visa-holder-tracker
    spec:
      containers:
        - name: visa-holder-tracker
          # Replace with your built/pushed image if different.
          image: visa-holder-tracker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          # SPRING_DATASOURCE_URL, SPRING_JPA_*, POSTGRES_DB from the ConfigMap;
          # POSTGRES_USER/POSTGRES_PASSWORD/JWT_SECRETKEY from the Secret.
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-secret
          # Bridge the Postgres-named credentials onto the property names Spring
          # expects, sourced from the same Secret (single source of truth).
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # Actuator health endpoint is permitted in LoginSecurityConfig.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: visa-holder-tracker
  labels:
    app: visa-holder-tracker
spec:
  type: ClusterIP
  selector:
    app: visa-holder-tracker
  ports:
    - name: http
      port: 80
      targetPort: 9000