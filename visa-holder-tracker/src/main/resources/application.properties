spring.application.name=visa-holder-tracker
server.port=9000

# H2 config for local testing
spring.datasource.url=jdbc:h2:mem:visadb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true


spring.security.ignored=/h2-console/**
# http://localhost:9000/h2-console
# Won't work without the security config

# Enables the health actuator
management.endpoints.web.exposure.include=health

# Set to always show full health details
management.endpoint.health.show-details=always

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
