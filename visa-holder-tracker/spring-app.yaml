# =============================================================================
# Visa Holder Tracker (Spring Boot) — Secret, Deployment, Service
# Apply AFTER postgres.yaml:  kubectl apply -f visa-holder-tracker.yaml
#
# The container listens on 9000 (matches EXPOSE 9000 in your Dockerfile).
# DB connection + JWT secret are injected via environment variables that map
# onto Spring Boot relaxed-binding property names:
#   SPRING_DATASOURCE_URL        -> spring.datasource.url
#   SPRING_DATASOURCE_USERNAME   -> spring.datasource.username
#   SPRING_DATASOURCE_PASSWORD   -> spring.datasource.password
#   JWT_SECRETKEY                -> jwt.secretkey   (used by GenerateJWTToken)
# =============================================================================

# -----------------------------------------------------------------------------
# Secret: app-level secret (JWT signing key).
# Must be a Base64-encoded value, since GenerateJWTToken does
# Decoders.BASE64.decode(secretKey). Replace with your own strong key.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: visa-app-secret
  labels:
    app: visa-holder-tracker
type: Opaque
stringData:
  JWT_SECRETKEY: dGhpcy1pcy1hLXRlc3Qtb25seS1zZWNyZXQta2V5LWZvci1qd3Qtc2lnbmluZy0xMjM0NTY3ODkw
---
# -----------------------------------------------------------------------------
# Deployment: the Spring Boot API.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visa-holder-tracker
  labels:
    app: visa-holder-tracker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visa-holder-tracker
  template:
    metadata:
      labels:
        app: visa-holder-tracker
    spec:
      containers:
        - name: visa-holder-tracker
          # Replace with your built/pushed image, e.g. myregistry/visa-holder-tracker:0.0.1
          image: visa-holder-tracker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          env:
            # --- Datasource: points at the postgres Service from postgres.yaml ---
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/visa_holder_tracker
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            # Let Hibernate manage/validate schema. Adjust to taste:
            # 'update' for dev, 'validate' or 'none' once you manage migrations.
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: org.hibernate.dialect.PostgreSQLDialect
            # --- JWT signing key ---
            - name: JWT_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: visa-app-secret
                  key: JWT_SECRETKEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          # Actuator health endpoint is permitted in LoginSecurityConfig,
          # so probes can hit it without authentication.
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
# -----------------------------------------------------------------------------
# Service: exposes the app inside the cluster on port 80 -> container 9000.
# Change type to LoadBalancer (cloud) or NodePort to reach it externally,
# or front it with an Ingress.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: visa-holder-tracker
  labels:
    app: visa-holder-tracker
spec:
  type: ClusterIP
  selector:
    app: visa-holder-tracker
  ports:
    - name: http
      port: 80
      targetPort: 9000