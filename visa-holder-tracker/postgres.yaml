# =============================================================================
# PostgreSQL infrastructure deployment.
#
# This file creates:
#   1. PersistentVolumeClaim -> persistent database storage
#   2. Deployment            -> PostgreSQL database container
#   3. Service               -> internal Kubernetes database access
#
# Dependencies:
#   - db-config ConfigMap
#   - db-secret Secret
#
# Apply after db-config.yaml:
#   kubectl apply -f postgres.yaml
# =============================================================================

apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: postgres-pvc
  labels:
    app: postgres

spec:

  # ReadWriteOnce:
  # the volume can be mounted by only one node at a time.
  accessModes:
    - ReadWriteOnce

  resources:
    requests:

      # Amount of persistent storage requested
      # for PostgreSQL database files.
      storage: 2Gi

  # Optional storage class.
  # Uncomment if the Kubernetes cluster
  # requires an explicit storage class.
  # storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  labels:
    app: postgres

spec:

  # Single PostgreSQL instance.
  replicas: 1

  strategy:

    # Recreate ensures the old PostgreSQL pod
    # is fully terminated before a new one starts.
    #
    # Prevents multiple pods from attempting
    # to mount the same ReadWriteOnce volume.
    type: Recreate

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:

        - name: postgres

          # Official lightweight PostgreSQL image.
          image: postgres:16-alpine

          ports:
            - name: postgres

              # PostgreSQL default database port.
              containerPort: 5432

          envFrom:

            # Loads non-sensitive database configuration
            # from the shared ConfigMap.
            - configMapRef:
                name: db-config

            # Loads sensitive credentials
            # from Kubernetes Secret storage.
            - secretRef:
                name: db-secret

          env:

            # PostgreSQL internal data directory.
            #
            # Keeps database files inside the mounted volume.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:

            # Mounts persistent storage
            # into the PostgreSQL container.
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

          resources:

            # Minimum guaranteed resources.
            requests:
              cpu: "100m"
              memory: "256Mi"

            # Maximum allowed resource usage.
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Readiness probe:
          # checks whether PostgreSQL
          # is ready to accept connections.
          #
          # If POSTGRES_USER or POSTGRES_DB changes,
          # update these probe values too.
          readinessProbe:
            exec:
              command:
                [
                  "pg_isready",
                  "-U",
                  "visa_app",
                  "-d",
                  "visa_holder_tracker"
                ]

            # Wait before first readiness check.
            initialDelaySeconds: 10

            # Probe frequency.
            periodSeconds: 5

            # Probe timeout limit.
            timeoutSeconds: 3

          # Liveness probe:
          # checks whether PostgreSQL
          # is still healthy and running.
          #
          # Failed checks trigger container restart.
          livenessProbe:
            exec:
              command:
                [
                  "pg_isready",
                  "-U",
                  "visa_app",
                  "-d",
                  "visa_holder_tracker"
                ]

            # Delay before liveness checks begin.
            initialDelaySeconds: 30

            # Probe frequency.
            periodSeconds: 10

            # Probe timeout limit.
            timeoutSeconds: 3

      volumes:

        # Persistent volume attached
        # to the PostgreSQL container.
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service

metadata:
  name: postgres
  labels:
    app: postgres

spec:

  # Internal-only Kubernetes service.
  #
  # Accessible inside the cluster using:
  #   postgres:5432
  type: ClusterIP

  selector:
    app: postgres

  ports:

    - name: postgres

      # Service port exposed inside the cluster.
      port: 5432

      # PostgreSQL container port.
      targetPort: 5432